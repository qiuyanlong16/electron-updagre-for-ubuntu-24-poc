<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nanobot - Lenovo OEM Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo { font-size: 3rem; margin-bottom: 1rem; }
    .title { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .version-label { font-size: 0.9rem; color: #aaa; margin-bottom: 0.25rem; }
    .version-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: #00d4ff;
      margin-bottom: 1rem;
      font-family: monospace;
    }
    .status {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      background: rgba(39, 174, 96, 0.2);
    }
    .info {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🤖</div>
    <div class="title">Nanobot</div>
    <div class="version-label">Lenovo OEM Assistant</div>
    <div class="version-value" id="app-version">Loading...</div>
    <div class="status" id="app-status">Initializing...</div>
    <div class="info">AppArmor Protected · Auto-Update Enabled</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
